# stimuliiq local dev infra — Postgres 16 + Redis 7 (CLAUDE.md §1, docs/04 §4).
#
# Usage (run from the REPO ROOT): `docker compose -f infra/docker-compose.yml
# --env-file .env up -d`. Reads the repo-root `.env` — copy `.env.example` first.
#
# POSTGRES IMAGE (`pgvector/pgvector:pg16`): this was introduced for an "AI Mentor" pgvector
# retrieval feature that was later FULLY REMOVED (mentors are human hires, not AI — see
# docs/adr/0055-ai-mentor-exploration-and-removal.md). The `vector` extension and its tables
# were dropped; NOTHING in the app uses pgvector anymore. The image is RETAINED because it is
# a strict superset of plain `postgres:16` (Debian build FROM postgres:16) and is fully
# binary-compatible with the existing `stimuliiq_postgres_data` volume — reverting to
# `postgres:16-alpine` would require a container recreate that risks a glibc↔musl collation
# mismatch on the existing volume. A devops follow-up may revert to `postgres:16-alpine` on a
# FRESH volume (then `pnpm db:migrate && pnpm db:seed`) if the lighter image is wanted. Tracked
# in docs/phase-8-followups.md.
#
# IMPORTANT: the `--env-file .env` flag is REQUIRED, not optional decoration. Compose
# resolves its own project directory (and therefore where it looks for an implicit
# `.env`) relative to the COMPOSE FILE's location (`infra/`), not the current working
# directory — so `docker compose -f infra/docker-compose.yml up -d` alone (no
# `--env-file`) looks for `infra/.env` (which does not exist) and silently falls back
# to only the `:-default` values below. That's harmless for `postgres`/`redis` (every
# var there has a default), but the `api` service's `COOKIE_SECRET`/`CSRF_SECRET`
# have NO default (`${VAR:?...}` — intentionally, since a placeholder cookie/CSRF
# secret must never accidentally be used) and Compose will hard-error without
# `--env-file .env` pointing at the real repo-root file. Confirmed by an actual
# `docker compose --profile full up` run during Phase-7 Wave 4 devops hardening.
#
# The `api` service below is OPT-IN (docker-compose `profiles: [full]`) — it does NOT
# start on a plain `docker compose up`, so the documented local-dev workflow (README:
# `pnpm install && pnpm db:migrate && pnpm dev` running apps directly on the host) is
# UNCHANGED. Use `docker compose -f infra/docker-compose.yml --env-file .env
# --profile full up -d` to also run the built API container — useful for
# smoke-testing the production Docker image (infra/docker/api.Dockerfile) or a
# self-hosted/staging-like full-stack run without provisioning Railway/ECS
# (Phase-7 Wave 4, devops CI hardening, item 4). BUILD-VERIFIED: this exact command
# was run end-to-end (image build + boot + `/api/v1/health/ready` returning 200) —
# see infra/docker/api.Dockerfile's header for what that verification found/fixed.

name: stimuliiq

services:
  postgres:
    # pgvector/pgvector:pg16 — a strict superset of postgres:16 (the `vector` extension is
    # present but UNUSED after the AI-mentor removal). Retained for volume compatibility;
    # see the header comment above.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stimuliiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stimuliiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stimuliiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - stimuliiq_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in — see the header comment. Build context is the repo root, so this file
  # must be invoked with `-f infra/docker-compose.yml` from the repo root (the
  # standard usage shown above), not from inside infra/.
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Mounts the host's `./keys` (generated by `pnpm gen:keys` — gitignored, never
    # baked into the image) read-only, so the container's default
    # JWT_PRIVATE_KEY_PATH/JWT_PUBLIC_KEY_PATH ("./keys/jwt-private.pem" etc., see
    # .env.example) resolve inside the container exactly as they do on the host —
    # run `pnpm gen:keys` from the repo root BEFORE `--profile full up`. Mounted at
    # /repo/apps/api/keys to match the image's runtime WORKDIR
    # (infra/docker/api.Dockerfile's `runtime` stage — resolveKeyPath() walks upward
    # from CWD, so this is found immediately without needing to walk further up).
    volumes:
      - ../keys:/repo/apps/api/keys:ro
    # LIST form deliberately, not map form (see the truly-optional entries below).
    # Confirmed by a real `docker compose --profile full up` run (Phase-7 Wave 4):
    # map-form `KEY: ${VAR:-}` ALWAYS sets the container's env var to an actual empty
    # string when VAR is unset — not the same as the var being absent. This app's
    # zod env schema (apps/api/src/config/env.ts) uses `.url().optional()` /
    # `.min(16).optional()` for SENTRY_DSN/OTEL_EXPORTER_OTLP_ENDPOINT/METRICS_TOKEN —
    # `.optional()` allows the key to be MISSING, but an empty string is still a
    # present value that fails `.url()`/`.min()`, so the app refused to boot
    # ("SENTRY_DSN: Invalid url", etc.) even though these vars are meant to be
    # fully optional/no-op. Bare `- NAME` (no `=value`) entries below are Compose's
    # documented pass-through form: if the shell/`--env-file` has no value for NAME,
    # the entry is OMITTED from the container's environment entirely (not set to
    # ""), which is exactly what an "optional, no-op-if-unset" var needs.
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-local}
      - API_PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-stimuliiq}
      - REDIS_URL=redis://redis:6379
      - JWT_PRIVATE_KEY_PATH=./keys/jwt-private.pem
      - JWT_PUBLIC_KEY_PATH=./keys/jwt-public.pem
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3000}
      - LMS_APP_URL=${LMS_APP_URL:-http://localhost:3001}
      - CRM_APP_URL=${CRM_APP_URL:-http://localhost:3002}
      - COOKIE_SECRET=${COOKIE_SECRET:?set COOKIE_SECRET in .env — see .env.example}
      - CSRF_SECRET=${CSRF_SECRET:?set CSRF_SECRET in .env — see .env.example}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-stimuliiq-api}
      # ── Observability (Phase-7 WS-C) — all optional/no-op when unset, per
      # apps/api/src/observability/{sentry,otel}.ts. Bare pass-through: omitted
      # entirely from the container unless set in `.env`/the host shell. Set real
      # values in `.env` ONLY for a staging-like run; never point a local compose
      # run at a real prod DSN.
      - SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - METRICS_TOKEN
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

# EXPECTED BEHAVIOR NOTE (not a bug — confirmed during Phase-7 Wave 4 devops
# hardening): with `NODE_ENV=production` (hardcoded above, matching a real prod
# image) and no `MAIL_PROVIDER`/`WHATSAPP_PROVIDER` credentials configured in your
# `.env`, the `api` container will refuse to boot — this is the application's OWN
# intentional fail-closed production-safety gate (it will not silently discard real
# emails/WhatsApp messages by defaulting to Noop in a production environment; see
# apps/api/src/modules/notifications/providers/*/*-provider.module.ts). This is
# correct: a genuine Railway/ECS production deploy would hit the exact same gate
# without real provider credentials. To fully boot this `--profile full` stack
# end-to-end, set real (or Noop-overriding) `MAIL_PROVIDER`/`WHATSAPP_PROVIDER` +
# their required keys in `.env` first (see .env.example). The Docker IMAGE itself
# (build, Prisma Client generation, dist output, health endpoint) is independently
# verified via `docker run -e NODE_ENV=development ...` + `curl
# /api/v1/health/ready` → 200, which bypasses only this one business-logic gate.

volumes:
  stimuliiq_postgres_data:
  stimuliiq_redis_data:
